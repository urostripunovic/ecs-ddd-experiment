<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DDD + ECS Arena</title>
    <style>
      :root {
        --ink: #e8e6e1;
        --muted: #9a978f;
        --panel: rgba(20, 21, 23, 0.72);
        --boss: #d9573b;
        --player: #7fb2d9;
        --line: rgba(255, 255, 255, 0.12);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #1b1c1e; overflow: hidden; }
      body { font: 13px/1.4 ui-monospace, 'SF Mono', Menlo, Consolas, monospace; color: var(--ink); }
      #app { position: fixed; inset: 0; cursor: crosshair; }
      #app canvas { display: block; }
      .hud { position: fixed; pointer-events: none; }
      .boss { top: 16px; left: 50%; transform: translateX(-50%); width: min(560px, calc(100% - 32px)); }
      .boss-name { display: flex; justify-content: space-between; margin-bottom: 6px; letter-spacing: 0.08em; text-transform: uppercase; }
      .bar { height: 10px; background: var(--panel); border: 1px solid var(--line); }
      .bar > div { height: 100%; width: 100%; transform-origin: left; }
      .boss .bar > div { background: var(--boss); }
      .player { left: 16px; bottom: 16px; width: 240px; padding: 10px 12px; background: var(--panel); border: 1px solid var(--line); }
      .player .bar > div { background: var(--player); }
      .row { display: flex; justify-content: space-between; margin-top: 8px; color: var(--muted); }
      .row b { color: var(--ink); font-weight: 600; }
      .status { color: #e3b341; min-height: 1.4em; margin-top: 4px; }
      .gauge { left: 50%; bottom: 96px; transform: translateX(-50%); width: 220px; height: 12px;
               background: var(--panel); border: 1px solid var(--line); }
      .gauge-zone { position: absolute; top: 0; bottom: 0; background: rgba(227, 179, 65, 0.18); border: 1px solid #e3b341; }
      .gauge-fill { position: absolute; inset: 0; transform-origin: left; background: var(--ink); opacity: 0.85; }
      .gauge-fill.perfect { background: #e3b341; }
      .gauge-fill.over { background: var(--boss); }
      .help { right: 16px; bottom: 16px; color: var(--muted); text-align: right; }
      .log { left: 16px; top: 64px; max-width: min(620px, calc(100% - 32px)); max-height: 40vh; overflow: hidden;
             margin: 0; padding: 10px 12px; background: var(--panel); border: 1px solid var(--line); white-space: pre-wrap; font-size: 12px; }
      .banner { inset: 0; display: grid; place-items: center; text-align: center; }
      .banner h1 { margin: 0; font-size: 44px; letter-spacing: 0.2em; }
      .banner p { color: var(--muted); }
      .cheated { right: 16px; top: 16px; color: #e3b341; letter-spacing: 0.1em; }
      .god { position: fixed; right: 16px; top: 44px; width: 340px; max-height: calc(100vh - 60px); overflow: auto;
             padding: 10px 12px; background: rgba(20, 21, 23, 0.94); border: 1px solid #e3b341; z-index: 10; }
      .god h2 { margin: 0 0 8px; font-size: 14px; color: #e3b341; letter-spacing: 0.08em; text-transform: uppercase; }
      .god h2 small { color: var(--muted); text-transform: none; letter-spacing: 0; font-weight: normal; }
      .god h3 { margin: 10px 0 6px; font-size: 12px; color: var(--muted); font-weight: normal; }
      .god label { display: block; margin: 3px 0; }
      .god .row { flex-wrap: wrap; gap: 6px; justify-content: flex-start; margin-top: 6px; }
      .god button, .god select, .god input { font: inherit; color: var(--ink); background: #2a2c30; border: 1px solid var(--line); padding: 3px 6px; }
      .god button:hover { border-color: #e3b341; }
      .god select { width: 100%; }
      .god .fields label { display: flex; justify-content: space-between; gap: 8px; }
      .god .fields input { width: 90px; }
      .god .check, .god .muted { color: var(--muted); margin: 6px 0 0; }
      [hidden] { display: none !important; }
      @media (max-width: 640px) { .help { display: none; } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
